name: Build Windows installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Fetch bundled tools (yt-dlp, ffmpeg, deno)
        shell: pwsh
        run: ./scripts/fetch-tools.ps1
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Build installers (NSIS + MSI)
        working-directory: src-tauri
        run: cargo tauri build
      - name: Pack browser extensions (Chrome/Edge, Firefox)
        shell: pwsh
        run: ./scripts/pack-extension.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EDM-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            build/edm-extension-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            build/edm-extension-*.zip
