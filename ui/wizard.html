<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser Extension Setup</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body { display: flex; flex-direction: column; background: var(--surface); }
  header { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
  header .bicon svg { width: 34px; height: 34px; stroke-width: 1.2; color: var(--accent); }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--bar-bg); }
  .dots span.on { background: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  main p { line-height: 1.5; }
  footer { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--border); background: var(--bg); }
  .status { display: flex; align-items: center; gap: 8px; }
  .status svg { width: 18px; height: 18px; }
  .status.ok { color: var(--success); }
  .status.pending { color: var(--text-2); }
</style>
</head>
<body>
  <header>
    <span class="bicon" id="bicon"></span>
    <div class="col" style="gap:2px;flex:1">
      <h2 id="browserName"></h2>
      <span class="caption" id="progressText"></span>
    </div>
    <div class="dots" id="dots"></div>
  </header>
  <main id="step"></main>
  <footer>
    <button class="btn" id="back" data-i18n="Back"></button>
    <div class="spacer"></div>
    <button class="btn" id="skip" data-i18n="Skip This Browser"></button>
    <button class="btn primary" id="next"></button>
  </footer>
  <script src="js/common.js"></script>
  <script src="js/wizard.js"></script>
</body>
</html>
