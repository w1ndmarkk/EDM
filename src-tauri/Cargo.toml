[package]
name = "edm"
version = "1.3.5"
description = "Fast, open-source multi-connection download manager for Windows"
authors = ["EDM contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
# HTTP/1.1 only: each Range request must get its own TCP connection (HTTP/2 would multiplex them onto one).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
percent-encoding = "2"
dirs = "5"
arboard = { version = "3", default-features = false }
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sys-locale = "0.3"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
